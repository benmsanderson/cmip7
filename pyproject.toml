[project]
name = "cmip7ref"
version = "0.1.0"
description = "Lightweight analysis of CMIP7 output via the Climate REF API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "xarray>=2024.6",
    "netcdf4>=1.6",
    "cftime>=1.6",
    "numpy>=1.26",
    "dask>=2024.1",
    "zarr>=2.18",
    "aiohttp>=3.9",
    "requests>=2.31",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cmip7ref"]

[tool.pytest.ini_options]
testpaths = ["tests"]
