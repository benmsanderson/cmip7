[project]
name = "cmip7ref"
version = "0.1.0"
description = "Lightweight analysis of CMIP7 output via the Climate REF API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cmip7ref"]

[tool.pytest.ini_options]
testpaths = ["tests"]
